packages:
  - apps/*
  - packages/*

# Versions exactes dans les package.json (CODING_STANDARDS, dépendances verrouillées).
saveExact: true

# Seuls ces paquets peuvent exécuter des scripts d'installation (binaires natifs, hooks Git).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  lefthook: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - zod@4.6.6
