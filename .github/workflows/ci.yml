# CI de base (PHASE-00, INFRASTRUCTURE.md 8). Bloquante sur chaque pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - name: Unit, integration (Testcontainers PostgreSQL 17), coverage and architecture
        run: pnpm test:cov && pnpm test:arch
      - run: pnpm test:isolation
      - run: pnpm build

  e2e:
    name: end-to-end smoke
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: orbit_owner
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: orbit
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U orbit_owner -d orbit"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://orbit_owner:ci_only_password@localhost:5433/orbit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Apply migrations
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.E2E_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
