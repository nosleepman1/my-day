# CI (PHASE-00, INFRASTRUCTURE.md 8). Bloquante sur chaque pull request.
# Exécutée sur un runner auto-hébergé (Linux, ou Windows avec Git Bash) disposant de Docker et de Node 24.
# Actions tierces épinglées par SHA de commit (chaîne d'approvisionnement).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: secret scanning (gitleaks)
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: lint, types, tests, build
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and critical block)
        run: pnpm audit --audit-level high
      - run: pnpm format:check
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - name: Unit, integration (Testcontainers PostgreSQL 17), coverage and architecture
        run: pnpm test:cov && pnpm test:arch
      - run: pnpm test:isolation
      - run: pnpm build

  infrastructure:
    name: images, scans and deployment configuration
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the api and worker images (no push)
        run: |
          for target in api worker; do
            docker build -f apps/api/Dockerfile --target "$target" --build-arg APP_VERSION="${GITHUB_SHA}" \
              -t "orbit-ci-${target}:${GITHUB_SHA}" .
          done
      - name: Scan the images (HIGH and CRITICAL with a fix block)
        run: |
          for target in api worker; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "orbit-ci-${target}:${GITHUB_SHA}"
          done
      - name: Validate the Caddyfile
        run: |
          docker run --rm -v "$PWD/infra/caddy:/etc/caddy:ro" \
            -e ACME_EMAIL=ops@example.com -e API_DOMAIN=api.example.com -e API_STAGING_DOMAIN=api-staging.example.com \
            -e N8N_DOMAIN=n8n.example.com -e ADMIN_ALLOWED_CIDRS=203.0.113.0/24 \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate Compose files (only Caddy publishes ports, data network internal)
        working-directory: infra/compose
        run: |
          cp ci-fixtures/compose.env ci-fixtures/n8n.env
          for env in production staging; do
            docker compose -f "compose.${env}.yml" --env-file ci-fixtures/compose.env config --format json |
              node ../scripts/check-compose-ports.mjs
          done
      - name: Shellcheck the operations scripts
        # La liste est construite sur l'hôte : l'image shellcheck n'a pas de shell pour développer les motifs.
        run: |
          mapfile -t files < <(ls infra/scripts/*.sh infra/provision/*.sh infra/compose/postgres/init-deployed/*.sh)
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 -x "${files[@]}"
      - name: Validate vercel.json (JSON and mandatory security headers)
        run: |
          node -e '
            const c = require("./apps/web/vercel.json");
            const h = c.headers.flatMap((r) => r.headers.map((x) => x.key));
            for (const k of ["Content-Security-Policy", "Strict-Transport-Security", "X-Content-Type-Options"]) {
              if (!h.includes(k)) throw new Error(`missing header ${k}`);
            }
            if (!c.rewrites.some((r) => r.has && r.destination.includes("api."))) throw new Error("production rewrite must be host-bound");'

  e2e:
    name: end-to-end smoke
    needs: quality
    runs-on: [self-hosted]
    timeout-minutes: 20
    env:
      CI: 'true'
      # Base et ports dédiés : n'entre jamais en conflit avec le poste de développement.
      COMPOSE_PROJECT_NAME: orbit-ci
      ORBIT_PG_PORT: '5434'
      ORBIT_SMTP_PORT: '1026'
      ORBIT_MAILPIT_UI_PORT: '8026'
      E2E_API_PORT: '3100'
      E2E_WEB_PORT: '5273'
      OWNER_DATABASE_URL: postgresql://orbit_owner:orbit_dev_only@localhost:5434/orbit
      E2E_DATABASE_URL: postgresql://orbit_app:orbit_dev_only@localhost:5434/orbit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Start an isolated PostgreSQL for this run
        run: docker compose -f infra/compose/compose.dev.yml up -d --wait
      - name: Apply migrations as owner
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.OWNER_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.OWNER_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Stop and remove the isolated PostgreSQL
        if: always()
        run: docker compose -f infra/compose/compose.dev.yml down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
