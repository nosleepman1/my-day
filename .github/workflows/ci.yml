# CI (PHASE-00, INFRASTRUCTURE.md 8). Bloquante sur chaque pull request.
# Exécutée sur un runner auto-hébergé (Linux, ou Windows avec Git Bash) disposant de Docker et de Node 24.
# Actions tierces épinglées par SHA de commit (chaîne d'approvisionnement).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: secret scanning (gitleaks)
    runs-on: [self-hosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: lint, types, tests, build
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and critical block)
        run: pnpm audit --audit-level high
      - run: pnpm format:check
      - run: pnpm build:packages
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - name: Unit, integration (Testcontainers PostgreSQL 17), coverage and architecture
        run: pnpm test:cov && pnpm test:arch
      - run: pnpm test:isolation
      - run: pnpm build

  e2e:
    name: end-to-end smoke
    needs: quality
    runs-on: [self-hosted]
    timeout-minutes: 20
    env:
      CI: 'true'
      # Base et ports dédiés : n'entre jamais en conflit avec le poste de développement.
      COMPOSE_PROJECT_NAME: orbit-ci
      ORBIT_PG_PORT: '5434'
      ORBIT_SMTP_PORT: '1026'
      ORBIT_MAILPIT_UI_PORT: '8026'
      E2E_API_PORT: '3100'
      E2E_WEB_PORT: '5273'
      OWNER_DATABASE_URL: postgresql://orbit_owner:orbit_dev_only@localhost:5434/orbit
      E2E_DATABASE_URL: postgresql://orbit_app:orbit_dev_only@localhost:5434/orbit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Start an isolated PostgreSQL for this run
        run: docker compose -f infra/compose/compose.dev.yml up -d --wait
      - name: Apply migrations as owner
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.OWNER_DATABASE_URL }}
          DATABASE_MIGRATION_URL: ${{ env.OWNER_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Stop and remove the isolated PostgreSQL
        if: always()
        run: docker compose -f infra/compose/compose.dev.yml down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
